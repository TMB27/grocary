<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Groco</title>

    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,300;0,400;0,500;0,600;1,100;1,300&display=swap');

        :root{
            --orange:#ff7800;
            --black:#130f40;
            --light-color:#666;
            --box-shadow:0 .5rem 1.5rem rgba(0,0,0,.1);
            --border:.2rem solid rgba(0,0,0,.1);
            --outline:.1rem solid rgba(0,0,0,.1);
            --outline-hover:.2rem solid var(--black);
        }

        *{
            font-family: 'Poppins', sans-serif;
            margin:0; padding:0;
            box-sizing: border-box;
            outline: none; border:none;
            text-decoration: none;
            text-transform: capitalize;
            transition: all .2s linear;
        }

        html{
            font-size: 62.5%;
            overflow-x: hidden;
            scroll-behavior: smooth;
            scroll-padding-top: 7rem;
        }

        body{
            background:#eee;
        }

        section{
            padding:2rem 9%;
        }

        .heading{
            text-align: center;
            padding:2rem 0;
            padding-bottom: 3rem;
            font-size: 3.5rem;
            color:var(--black);
        }

        .heading span{
            background: var(--orange);
            color:#fff;
            display: inline-block;
            padding:.5rem 3rem;
            clip-path: polygon(100% 0, 93% 50%, 100% 99%, 0% 100%, 7% 50%, 0% 0%);
        }

        .btn{
            margin-top: 1rem;
            display: inline-block;
            padding:.8rem 3rem;
            font-size: 1.7rem;
            border-radius: .5rem;
            border:.2rem solid var(--black);
            color:var(--black);
            cursor: pointer;
            background: none;
        }

        .btn:hover{
            background: var(--orange);
            color:#fff;
        }

        /* Payment Page Styles */
        .payment-page {
            padding: 10rem 2rem 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .payment-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .payment-form, .order-summary {
            background: #fff;
            border-radius: .5rem;
            box-shadow: var(--box-shadow);
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 1.6rem;
            color: var(--black);
            margin-bottom: 0.5rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 1rem;
            font-size: 1.6rem;
            color: var(--black);
            border: var(--border);
            border-radius: .5rem;
            background: #eee;
        }

        .form-group textarea {
            height: 10rem;
            resize: none;
        }

        .payment-methods {
            margin-top: 2rem;
        }

        .payment-method {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            padding: 1rem;
            border: var(--border);
            border-radius: .5rem;
            cursor: pointer;
        }

        .payment-method input {
            margin-right: 1rem;
        }

        .payment-method i {
            font-size: 2rem;
            margin-right: 1rem;
            color: var(--orange);
        }

        .order-summary h3 {
            font-size: 2rem;
            color: var(--black);
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: var(--border);
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1.6rem;
            color: var(--light-color);
        }

        .summary-item.total {
            font-size: 2rem;
            font-weight: bold;
            color: var(--orange);
            border-top: var(--border);
            padding-top: 1.5rem;
            margin-top: 1.5rem;
        }

        .proceed-btn {
            width: 100%;
            padding: 1.5rem;
            background: var(--orange);
            color: white;
            border: none;
            border-radius: .5rem;
            font-size: 1.6rem;
            cursor: pointer;
            margin-top: 2rem;
        }

        .proceed-btn:hover {
            background: #e66a00;
        }

        @media (max-width: 991px) {
            .payment-container {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 450px) {
            html {
                font-size: 50%;
            }
        }
    </style>
</head>
<body>

<!-- Payment Page Section Starts -->
<section class="payment-page">
    <h1 class="heading"> payment <span>details</span> </h1>

    <div class="payment-container">
        <div class="payment-form">
            <h3>Delivery Address</h3>
            <form id="paymentForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label for="address">Delivery Address</label>
                    <textarea id="address" required></textarea>
                </div>
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" required>
                </div>
                <div class="form-group">
                    <label for="state">State</label>
                    <input type="text" id="state" required>
                </div>
                <div class="form-group">
                    <label for="pincode">Pincode</label>
                    <input type="text" id="pincode" required>
                </div>

                <h3>Payment Method</h3>
                <div class="payment-methods">
                    <label class="payment-method">
                        <input type="radio" name="payment" value="credit" required>
                        <i class="fas fa-credit-card"></i>
                        Credit Card
                    </label>
                    <label class="payment-method">
                        <input type="radio" name="payment" value="debit">
                        <i class="fas fa-credit-card"></i>
                        Debit Card
                    </label>
                    <label class="payment-method">
                        <input type="radio" name="payment" value="upi">
                        <i class="fas fa-mobile-alt"></i>
                        UPI
                    </label>
                </div>

                <div class="form-group">
                    <label for="cardNumber">Card Number</label>
                    <input type="text" id="cardNumber" required>
                </div>
                <div class="form-group">
                    <label for="expiry">Expiry Date</label>
                    <input type="text" id="expiry" placeholder="MM/YY" required>
                </div>
                <div class="form-group">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" required>
                </div>

                <button type="submit" class="proceed-btn">Confirm Order</button>
            </form>
        </div>

        <div class="order-summary">
            <h3>Order Summary</h3>
            <div id="orderItems"></div>
            <div class="summary-item">
                <span>Subtotal</span>
                <span id="subtotal">₹0</span>
            </div>
            <div class="summary-item">
                <span>Shipping</span>
                <span id="shipping">Free</span>
            </div>
            <div class="summary-item">
                <span>Tax (18%)</span>
                <span id="tax">₹0</span>
            </div>
            <div class="summary-item total">
                <span>Total Amount</span>
                <span id="total">₹0</span>
            </div>
        </div>
    </div>
</section>

<script>
    // Load cart items and update summary
    function loadOrderSummary() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const orderItems = document.getElementById('orderItems');
        orderItems.innerHTML = '';

        cart.forEach(item => {
            const itemTotal = item.price * item.quantity;
            const itemElement = document.createElement('div');
            itemElement.className = 'summary-item';
            itemElement.innerHTML = `
                <span>${item.name} (${item.quantity} x ₹${item.price})</span>
                <span>₹${itemTotal}</span>
            `;
            orderItems.appendChild(itemElement);
        });

        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const shipping = subtotal > 500 ? 0 : 50;
        const tax = subtotal * 0.18;
        const total = subtotal + shipping + tax;

        document.getElementById('subtotal').textContent = `₹${subtotal}`;
        document.getElementById('shipping').textContent = shipping === 0 ? 'Free' : `₹${shipping}`;
        document.getElementById('tax').textContent = `₹${tax.toFixed(2)}`;
        document.getElementById('total').textContent = `₹${total.toFixed(2)}`;
    }

    // Handle form submission
    document.getElementById('paymentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Get form data
        const formData = {
            fullName: document.getElementById('fullName').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            city: document.getElementById('city').value,
            state: document.getElementById('state').value,
            pincode: document.getElementById('pincode').value,
            paymentMethod: document.querySelector('input[name="payment"]:checked').value,
            cardNumber: document.getElementById('cardNumber').value,
            expiry: document.getElementById('expiry').value,
            cvv: document.getElementById('cvv').value
        };

        // Save order details to localStorage
        localStorage.setItem('orderDetails', JSON.stringify(formData));
        
        // Redirect to confirmation page
        window.location.href = 'confirmation.html';
    });

    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
        loadOrderSummary();
    });
</script>

</body>
</html>
