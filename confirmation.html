<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - Groco</title>

    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,300;0,400;0,500;0,600;1,100;1,300&display=swap');

        :root{
            --orange:#ff7800;
            --black:#130f40;
            --light-color:#666;
            --box-shadow:0 .5rem 1.5rem rgba(0,0,0,.1);
            --border:.2rem solid rgba(0,0,0,.1);
            --outline:.1rem solid rgba(0,0,0,.1);
            --outline-hover:.2rem solid var(--black);
        }

        *{
            font-family: 'Poppins', sans-serif;
            margin:0; padding:0;
            box-sizing: border-box;
            outline: none; border:none;
            text-decoration: none;
            text-transform: capitalize;
            transition: all .2s linear;
        }

        html{
            font-size: 62.5%;
            overflow-x: hidden;
            scroll-behavior: smooth;
            scroll-padding-top: 7rem;
        }

        body{
            background:#eee;
        }

        section{
            padding:2rem 9%;
        }

        .heading{
            text-align: center;
            padding:2rem 0;
            padding-bottom: 3rem;
            font-size: 3.5rem;
            color:var(--black);
        }

        .heading span{
            background: var(--orange);
            color:#fff;
            display: inline-block;
            padding:.5rem 3rem;
            clip-path: polygon(100% 0, 93% 50%, 100% 99%, 0% 100%, 7% 50%, 0% 0%);
        }

        .btn{
            margin-top: 1rem;
            display: inline-block;
            padding:.8rem 3rem;
            font-size: 1.7rem;
            border-radius: .5rem;
            border:.2rem solid var(--black);
            color:var(--black);
            cursor: pointer;
            background: none;
        }

        .btn:hover{
            background: var(--orange);
            color:#fff;
        }

        /* Confirmation Page Styles */
        .confirmation-page {
            padding: 10rem 2rem 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .confirmation-container {
            background: #fff;
            border-radius: .5rem;
            box-shadow: var(--box-shadow);
            padding: 3rem;
            margin-bottom: 2rem;
        }

        .confirmation-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .confirmation-header i {
            font-size: 6rem;
            color: #4CAF50;
            margin-bottom: 1rem;
        }

        .confirmation-header h2 {
            font-size: 3rem;
            color: var(--black);
            margin-bottom: 1rem;
        }

        .confirmation-header p {
            font-size: 1.6rem;
            color: var(--light-color);
        }

        .order-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .details-section {
            background: #f9f9f9;
            padding: 2rem;
            border-radius: .5rem;
        }

        .details-section h3 {
            font-size: 2rem;
            color: var(--black);
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: var(--border);
        }

        .detail-item {
            margin-bottom: 1rem;
            font-size: 1.6rem;
        }

        .detail-item label {
            color: var(--light-color);
            display: block;
            margin-bottom: 0.5rem;
        }

        .detail-item span {
            color: var(--black);
            font-weight: 500;
        }

        .order-summary {
            margin-top: 3rem;
        }

        .order-summary h3 {
            font-size: 2rem;
            color: var(--black);
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: var(--border);
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1.6rem;
            color: var(--light-color);
        }

        .summary-item.total {
            font-size: 2rem;
            font-weight: bold;
            color: var(--orange);
            border-top: var(--border);
            padding-top: 1.5rem;
            margin-top: 1.5rem;
        }

        .continue-shopping {
            text-align: center;
            margin-top: 3rem;
        }

        .continue-shopping .btn {
            background: var(--orange);
            color: white;
            padding: 1.5rem 4rem;
        }

        .continue-shopping .btn:hover {
            background: #e66a00;
        }

        @media (max-width: 991px) {
            .order-details {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 450px) {
            html {
                font-size: 50%;
            }
        }
    </style>
</head>
<body>

<!-- Confirmation Page Section Starts -->
<section class="confirmation-page">
    <div class="confirmation-container">
        <div class="confirmation-header">
            <i class="fas fa-check-circle"></i>
            <h2>Order Confirmed!</h2>
            <p>Thank you for your purchase. Your order has been successfully placed.</p>
        </div>

        <div class="order-details">
            <div class="details-section">
                <h3>Delivery Details</h3>
                <div class="detail-item">
                    <label>Full Name</label>
                    <span id="deliveryName"></span>
                </div>
                <div class="detail-item">
                    <label>Phone Number</label>
                    <span id="deliveryPhone"></span>
                </div>
                <div class="detail-item">
                    <label>Address</label>
                    <span id="deliveryAddress"></span>
                </div>
                <div class="detail-item">
                    <label>City</label>
                    <span id="deliveryCity"></span>
                </div>
                <div class="detail-item">
                    <label>State</label>
                    <span id="deliveryState"></span>
                </div>
                <div class="detail-item">
                    <label>Pincode</label>
                    <span id="deliveryPincode"></span>
                </div>
            </div>

            <div class="details-section">
                <h3>Payment Details</h3>
                <div class="detail-item">
                    <label>Payment Method</label>
                    <span id="paymentMethod"></span>
                </div>
                <div class="detail-item">
                    <label>Card Number</label>
                    <span id="cardNumber"></span>
                </div>
                <div class="detail-item">
                    <label>Order Date</label>
                    <span id="orderDate"></span>
                </div>
                <div class="detail-item">
                    <label>Order ID</label>
                    <span id="orderId"></span>
                </div>
            </div>
        </div>

        <div class="order-summary">
            <h3>Order Summary</h3>
            <div id="orderItems"></div>
            <div class="summary-item">
                <span>Subtotal</span>
                <span id="subtotal">₹0</span>
            </div>
            <div class="summary-item">
                <span>Shipping</span>
                <span id="shipping">Free</span>
            </div>
            <div class="summary-item">
                <span>Tax (18%)</span>
                <span id="tax">₹0</span>
            </div>
            <div class="summary-item total">
                <span>Total Amount</span>
                <span id="total">₹0</span>
            </div>
        </div>

        <div class="continue-shopping">
            <a href="products.html" class="btn">Continue Shopping</a>
        </div>
    </div>
</section>

<script>
    // Load order details and update confirmation page
    function loadOrderDetails() {
        const orderDetails = JSON.parse(localStorage.getItem('orderDetails'));
        const cart = JSON.parse(localStorage.getItem('cart')) || [];

        if (!orderDetails || !cart.length) {
            window.location.href = 'cart.html';
            return;
        }

        // Update delivery details
        document.getElementById('deliveryName').textContent = orderDetails.fullName;
        document.getElementById('deliveryPhone').textContent = orderDetails.phone;
        document.getElementById('deliveryAddress').textContent = orderDetails.address;
        document.getElementById('deliveryCity').textContent = orderDetails.city;
        document.getElementById('deliveryState').textContent = orderDetails.state;
        document.getElementById('deliveryPincode').textContent = orderDetails.pincode;

        // Update payment details
        document.getElementById('paymentMethod').textContent = orderDetails.paymentMethod.toUpperCase();
        document.getElementById('cardNumber').textContent = '**** **** **** ' + orderDetails.cardNumber.slice(-4);
        
        // Generate order date and ID
        const now = new Date();
        document.getElementById('orderDate').textContent = now.toLocaleDateString();
        document.getElementById('orderId').textContent = 'GRO' + Math.floor(Math.random() * 1000000).toString().padStart(6, '0');

        // Update order items
        const orderItems = document.getElementById('orderItems');
        orderItems.innerHTML = '';

        cart.forEach(item => {
            const itemTotal = item.price * item.quantity;
            const itemElement = document.createElement('div');
            itemElement.className = 'summary-item';
            itemElement.innerHTML = `
                <span>${item.name} (${item.quantity} x ₹${item.price})</span>
                <span>₹${itemTotal}</span>
            `;
            orderItems.appendChild(itemElement);
        });

        // Update totals
        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const shipping = subtotal > 500 ? 0 : 50;
        const tax = subtotal * 0.18;
        const total = subtotal + shipping + tax;

        document.getElementById('subtotal').textContent = `₹${subtotal}`;
        document.getElementById('shipping').textContent = shipping === 0 ? 'Free' : `₹${shipping}`;
        document.getElementById('tax').textContent = `₹${tax.toFixed(2)}`;
        document.getElementById('total').textContent = `₹${total.toFixed(2)}`;

        // Clear cart after successful order
        localStorage.removeItem('cart');
    }

    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
        loadOrderDetails();
    });
</script>

</body>
</html>
