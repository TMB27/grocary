<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Groco</title>
    
    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- Custom CSS File Link -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body {
            background: #f9f9f9;
            font-family: 'Poppins', sans-serif;
        }
        
        .forgot-password-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .forgot-password-container h2 {
            color: #27ae60;
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        
        .forgot-password-container h2 i {
            color: #27ae60;
            margin-right: 10px;
        }
        
        .forgot-password-container p {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            border-color: #27ae60;
            box-shadow: 0 0 5px rgba(39, 174, 96, 0.3);
        }
        
        .btn-reset {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .btn-reset:hover {
            background: #219a52;
            transform: translateY(-2px);
        }
        
        .links {
            margin-top: 25px;
            text-align: center;
        }
        
        .links a {
            color: #27ae60;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .links a:hover {
            color: #219a52;
            text-decoration: underline;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .success-message {
            color: #27ae60;
            font-size: 16px;
            margin-top: 15px;
            padding: 15px;
            background: rgba(39, 174, 96, 0.1);
            border-radius: 5px;
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .steps {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: left;
        }
        
        .steps h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .steps ol {
            padding-left: 20px;
            color: #666;
        }
        
        .steps li {
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .back-to-login {
            display: inline-flex;
            align-items: center;
            margin-top: 20px;
            color: #27ae60;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .back-to-login i {
            margin-right: 8px;
            transition: transform 0.3s ease;
        }
        
        .back-to-login:hover {
            color: #219a52;
        }
        
        .back-to-login:hover i {
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <div class="forgot-password-container">
        <h2><i class="fas fa-key"></i> Reset Password</h2>
        <p>Enter your email address and we'll send you a link to reset your password.</p>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
                <div class="error-message" id="emailError"></div>
                <div class="success-message" id="successMessage"></div>
            </div>
            <button type="submit" class="btn-reset">Send Reset Link</button>
        </form>
        
        <div class="steps">
            <h3>How to reset your password:</h3>
            <ol>
                <li>Enter your email address above</li>
                <li>Check your email for the reset link</li>
                <li>Click the link in the email</li>
                <li>Create your new password</li>
            </ol>
        </div>
        
        <a href="login.html" class="back-to-login">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const emailError = document.getElementById('emailError');
            const successMessage = document.getElementById('successMessage');
            
            // Reset messages
            emailError.style.display = 'none';
            successMessage.style.display = 'none';
            
            let isValid = true;
            
            // Email validation
            if (!email) {
                emailError.textContent = 'Email is required';
                emailError.style.display = 'block';
                isValid = false;
            } else if (!/\S+@\S+\.\S+/.test(email)) {
                emailError.textContent = 'Please enter a valid email address';
                emailError.style.display = 'block';
                isValid = false;
            }
            
            if (isValid) {
                // Here you would typically make an API call to your backend
                console.log('Password reset requested for:', email);
                
                // Show success message with animation
                successMessage.textContent = 'Password reset link has been sent to your email. Please check your inbox.';
                successMessage.style.display = 'block';
                
                // Clear the form
                document.getElementById('email').value = '';
                
                // You might want to add a timeout to redirect back to login
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            }
        });
    </script>
</body>
</html>
